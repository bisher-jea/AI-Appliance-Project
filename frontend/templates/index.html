<!DOCTYPE html>
<html>

<head>
    <title>Appliance IQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>
    <style>
    body {
        margin: 0;
        height: 100vh;
        background: #012169;
        background: linear-gradient(0deg, rgba(1, 33, 105, 1) 0%, rgba(59, 165, 212, 1) 63%, rgba(78, 195, 224, 1) 100%);
    }
    </style>
    <!-- HERO BANNER -->

    <section class="hero">

        <div class="hero-overlay">

            <h1>ApplianceIQ</h1>

            <p>
                Upload appliance photos and equipment details
                for AI-powered analysis.
            </p>

        </div>

    </section>

    <!-- FORM -->

    <h1>Appliance Information</h1>

    <form id="machineForm" class="appliance-form" method="post" enctype="multipart/form-data">
        <label for="address">Street Address:</label>
        <input type="text" id="address" name="address" required>

        <br>
        <br>

        <label for="applianceType">Appliance Type:</label>
        <select id="applianceType" name="applianceType" required>
            <option value="">--Select Appliance--</option>
            <option value="HVAC">HVAC</option>
            <option value="Water Heater">Water Heater</option>
        </select>

        <br><br>

        <label for="applianceCount">How many HVAC and/or water heater appliances does the home have?</label>
        <input type="number" id="applianceCount" name="applianceCount" min="1" max ="6" required>

        <br><br>

        <div id="applianceContainer"></div>

        <br>

        <button type="submit">submit</button>

    </form>
    <br>
    <br>

     <div class="homepage-actions">
        <a
            href="#machineForm"
            class="homepage-button homepage-button-primary"
        >
            New Submission
        </a>

        <a
            href="/admin/login"
            class="homepage-button homepage-button-secondary"
        >
            Admin Dashboard
        </a>
    </div>
    <footer class="footer">
        <img src="/static/images/white_jea.png" alt="JEA Logo" class="footer-logo">

    </footer>

    <script src="/static/script.js"></script>

</body>

</html>
