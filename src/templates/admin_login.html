<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ApplianceIQ Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./static/admin_login.css">
</head>

<body>
    <div class="login-page">

        <div class="login-card">
            <h1>Admin Login</h1>

            <form id="loginForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="loginError"></p>
            </form>
        </div>

        <a href="./index.html" class="back-btn">
            ← Back to ApplianceIQ
        </a>

    </div>

    <script type="module" src="./static/admin_login.js?v=3"></script>
</body>

</html>
